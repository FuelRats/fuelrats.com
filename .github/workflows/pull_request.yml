name: Test

on:
  pull_request:
    branches: [ develop, release ]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.owner.login == github.repository_owner }}
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        uses: wearerequired/lint-action@v2.3.0
        with:
          github_token: ${{ secrets.github_token }}
          eslint: true
          eslint_args: "--max-warnings 0"
          stylelint: true
          stylelint_args: "--max-warnings 0"
          stylelint_extensions: "css,sass,scss"

  build-docker:
    runs-on: ubuntu-latest
    name: Build and Test (Docker)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fuelrats-web:test .

      - name: Test Docker container starts
        run: |
          docker run -d \
            --name fuelrats-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e APP_URL=http://localhost:3000 \
            fuelrats-web:test
          
          # Wait for container to be ready
          sleep 10
          
          # Check if container is running
          docker ps | grep fuelrats-test
          
          # Test the application responds
          curl -f http://localhost:3000 || exit 1
          
          # Check container logs for errors
          docker logs fuelrats-test
          
          # Cleanup
          docker stop fuelrats-test
          docker rm fuelrats-test

  build:
    runs-on: ubuntu-latest
    name: Build Test (Node.js)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Load Next Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/dist/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production
