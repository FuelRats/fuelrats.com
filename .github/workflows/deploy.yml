name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ develop, release ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fuelrats/fuelrats.com

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CI=true
            GITHUB_REF=${{ github.ref }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_RUN_ID=${{ github.run_id }}
            GITHUB_SERVER_URL=${{ github.server_url }}
            GITHUB_REPOSITORY=${{ github.repository }}

      - name: Setup Bun
        if: github.ref == 'refs/heads/develop'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: github.ref == 'refs/heads/develop'
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request
        if: github.ref == 'refs/heads/develop'
        uses: changesets/action@v1.4.10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "chore: Version Changelog"
          commit: "chore: version changelog"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Determine service name
        id: service
        run: |
          case "${{ github.ref }}" in
            refs/heads/develop)
              echo "name=fr-web-dev_web" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/release)
              echo "name=fr-web_web" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.FR_SSH_KEY }}
          known_hosts: ${{ secrets.FR_KNOWN_HOSTS }}

      - name: Deploy to Docker Swarm
        run: |
          ssh fuelrats@mozzarella.fuelrats.com \
            "docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} ${{ steps.service.outputs.name }}"
