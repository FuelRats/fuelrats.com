services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "3000:3000"
    environment:
      # Application settings
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT:-3000}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - APP_PROXIED=${APP_PROXIED:-false}

      # Fuel Rats API
      - FR_API_URL=${FR_API_URL:-https://dev.api.fuelrats.com}
      - FR_SOCKET_URL=${FR_SOCKET_URL:-wss://dev.api.fuelrats.com}
      - FR_FALLBACK_URL=${FR_FALLBACK_URL:-https://fallback.fuelrats.com/}

      # External APIs
      - FR_EDSM_API_URL=${FR_EDSM_API_URL:-https://www.edsm.net/api-v1}
      - FR_WORDPRESS_URL=${FR_WORDPRESS_URL:-https://wordpress.fuelrats.com}
      - FR_SAPI_URL=${FR_SAPI_URL:-https://systems.api.fuelrats.com}

      # QMS
      - QMS_API_URL=${QMS_API_URL:-https://api.qms.fuelrats.dev}

      # IRC
      - FR_CLIENT_IRC_URL=${FR_CLIENT_IRC_URL:-https://qms.fuelrats.dev}
      - FR_RAT_IRC_URL=${FR_RAT_IRC_URL:-https://kiwi.fuelrats.com}

      # Secrets — set via .env file or Portainer environment.
      # NOT listed here so empty defaults don't block .env loading.
    restart: unless-stopped
    networks:
      - fuelrats

networks:
  fuelrats:
    driver: bridge
